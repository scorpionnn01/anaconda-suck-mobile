<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anaconda and Suck - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* Top Center Transparent Big Level Display */
        #levelHUD {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 900;
            color: rgba(255, 255, 255, 0.16);
            font-family: 'Courier New', monospace;
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }

        /* Bottom Left Weapon HUD */
        #weaponHUD {
            position: absolute;
            bottom: 16px;
            left: 14px;
            z-index: 10;
            font-family: 'Courier New', monospace;
            font-size: clamp(12px, 2.8vw, 18px);
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-left: 3px solid #00ffcc;
            border-radius: 4px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Top Right Health HUD */
        #healthHUD {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 10;
            font-family: 'Courier New', monospace;
            font-size: clamp(12px, 2.8vw, 18px);
            color: #fff;
            text-align: right;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-right: 4px solid #ff4444;
            border-radius: 4px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #healthHUD div {
            white-space: nowrap;
        }

        #fullscreenBtn {
            position: absolute;
            bottom: 16px;
            right: 14px;
            z-index: 20;
            padding: 6px 14px;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            font-size: clamp(10px, 2vw, 14px);
            transition: all 0.2s;
            touch-action: manipulation;
        }
        #fullscreenBtn:hover {
            background: #ffd700;
            color: #000;
        }
        #fullscreenBtn:active {
            transform: scale(0.92);
        }

        /* Mobile Touch Hint (floating) */
        #touchHint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Courier New', monospace;
            font-size: clamp(13px, 3vw, 20px);
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: opacity 1.2s ease;
            letter-spacing: 0.5px;
        }
        #touchHint span {
            display: inline-block;
            color: #ff6644;
            font-weight: bold;
        }

        /* Cinematic Horror Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(20, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }
        .title-glow {
            font-size: clamp(34px, 12vw, 70px);
            color: #ff1a1a;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #800000;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .subtitle-card {
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 10px 0;
            max-width: 90vw;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.12);
        }
        .text-main {
            font-size: clamp(16px, 4vw, 26px);
            color: #ffcccc;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        #fingerIcon {
            font-size: clamp(60px, 18vw, 100px);
            margin: 12px 0;
            text-shadow: 0 0 35px #ff0000;
            animation: pulse 1.1s infinite ease-in-out;
            display: none;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.22) rotate(-6deg);
            }
            100% {
                transform: scale(1);
            }
        }

        .btn-container {
            display: flex;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .actionBtn {
            padding: 14px 30px;
            font-size: clamp(16px, 4vw, 22px);
            background: linear-gradient(135deg, #ff1a1a, #800000);
            color: #fff;
            border: 2px solid #ffd700;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            transition: all 0.2s ease;
            touch-action: manipulation;
            min-width: 120px;
        }
        .actionBtn:active {
            transform: scale(0.94);
            background: linear-gradient(135deg, #ffd700, #ff8800);
            color: #000;
        }
        .actionBtn:hover {
            background: linear-gradient(135deg, #ffd700, #ff8800);
            color: #000;
            box-shadow: 0 0 35px #ffd700;
            transform: scale(1.04);
        }
        .exitBtn {
            background: linear-gradient(135deg, #333, #111);
            border-color: #aaa;
        }
        .exitBtn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Touch indicator ring (subtle) */
        #touchRing {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 12;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            display: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            transition: width 0.15s, height 0.15s, opacity 0.15s;
        }
        #touchRing.active {
            border-color: rgba(255, 100, 50, 0.4);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 80, 30, 0.08) 0%, transparent 70%);
        }

        /* small screen tweaks */
        @media (max-width: 480px) {
            #weaponHUD {
                bottom: 12px;
                left: 10px;
                padding: 4px 10px;
                font-size: 11px;
            }
            #healthHUD {
                top: 10px;
                right: 10px;
                padding: 5px 10px;
                font-size: 11px;
            }
            #levelHUD {
                top: 8px;
                font-size: 24px;
            }
            #fullscreenBtn {
                bottom: 12px;
                right: 10px;
                padding: 4px 10px;
                font-size: 10px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            #touchHint {
                bottom: 50px;
                font-size: 12px;
                padding: 4px 14px;
            }
            #healthHUD {
                font-size: 11px;
                padding: 4px 10px;
            }
            #weaponHUD {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- HUD Elements -->
    <div id="levelHUD">LEVEL 1</div>
    <div id="weaponHUD">⚔ <span id="weaponDisplay" style="color:#fff;">AK-47</span></div>
    <div id="healthHUD">
        <div>❤️ <span id="playerHpDisplay" style="color:#00ffcc;">100</span> / 100</div>
        <div>🐉 <span id="bossHpDisplay" style="color:#ff4444;">350</span></div>
    </div>

    <button id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Full</button>

    <!-- Mobile Touch Hint -->
    <div id="touchHint">👆 <span>Touch & Drag</span> to move · Hold to <span>Fire</span></div>

    <!-- Touch visual ring -->
    <div id="touchRing"></div>

    <div id="overlay">
        <div id="overlayContent">
            <h1 class="title-glow">ANACONDA &amp; SUCK</h1>
            <div class="subtitle-card">
                <p class="text-main">Face the ever-evolving Dragon-Anaconda titan across infinite levels!<br>Level 5+ unleashes dragon fire &amp; linear assaults.</p>
            </div>
        </div>
        <div id="fingerIcon">🖕</div>
        <div class="btn-container" id="menuBtnContainer">
            <button class="actionBtn" onclick="startGame()">▶ START</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // ============ CANVAS SETUP ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // ============ AUDIO ============
        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;
        let audioUnlocked = false;

        function unlockAudio() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioUnlocked = true;
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        function startHorrorBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            if (audioCtx.state === 'suspended') audioCtx.resume();

            let beat = 0;
            bgmInterval = setInterval(() => {
                if (gameState !== 'PLAYING') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const droneNotes = [45, 48.5, 42, 38];
                    osc.frequency.setValueAtTime(droneNotes[beat % droneNotes.length], audioCtx.currentTime);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.3);
                    beat++;
                } catch (e) { /* ignore */ }
            }, 900);
        }

        function stopBGM() {
            if (bgmInterval) { clearInterval(bgmInterval);
                bgmInterval = null; }
        }

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'gun') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.09);
                    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
                } else if (type === 'heavy') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.14);
                    gain.gain.setValueAtTime(0.30, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
                } else if (type === 'bazooka') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.40, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                } else if (type === 'fireball') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.30, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.30, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                } else if (type === 'scary_drone') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.8);
                    gain.gain.setValueAtTime(0.50, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);
                }
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.8);
            } catch (e) { /* ignore */ }
        }

        // ============ INPUTS ============
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // ============ TOUCH CONTROLS ============
        let isTouching = false;
        let touchX = 0;
        let touchY = 0;
        let touchActive = false; // true when finger is down

        const touchRing = document.getElementById('touchRing');

        function handleTouchStart(e) {
            e.preventDefault();
            unlockAudio();
            const t = e.touches[0];
            if (!t) return;
            touchX = t.clientX;
            touchY = t.clientY;
            touchActive = true;
            isTouching = true;

            // Show ring
            touchRing.style.display = 'block';
            touchRing.style.left = touchX + 'px';
            touchRing.style.top = touchY + 'px';
            touchRing.classList.add('active');

            // Move player instantly to touch position
            if (gameState === 'PLAYING') {
                player.x = Math.max(60, Math.min(width - 60, touchX));
            }

            // Hide hint after first touch
            const hint = document.getElementById('touchHint');
            if (hint) hint.style.opacity = '0';
            setTimeout(() => { if (hint) hint.style.display = 'none'; }, 1500);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const t = e.touches[0];
            if (!t) return;
            touchX = t.clientX;
            touchY = t.clientY;

            touchRing.style.left = touchX + 'px';
            touchRing.style.top = touchY + 'px';

            if (gameState === 'PLAYING') {
                player.x = Math.max(60, Math.min(width - 60, touchX));
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchActive = false;
            isTouching = false;
            touchRing.classList.remove('active');
            touchRing.style.display = 'none';
        }

        function handleTouchCancel(e) {
            e.preventDefault();
            touchActive = false;
            isTouching = false;
            touchRing.classList.remove('active');
            touchRing.style.display = 'none';
        }

        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchCancel, { passive: false });

        // Also allow mouse drag on desktop (optional)
        let mouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            isTouching = true;
            touchX = e.clientX;
            if (gameState === 'PLAYING') {
                player.x = Math.max(60, Math.min(width - 60, touchX));
            }
            unlockAudio();
        });
        canvas.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                touchX = e.clientX;
                if (gameState === 'PLAYING') {
                    player.x = Math.max(60, Math.min(width - 60, touchX));
                }
            }
        });
        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
            isTouching = false;
        });
        canvas.addEventListener('mouseleave', () => {
            mouseDown = false;
            isTouching = false;
        });

        // ============ GAME STATE ============
        let gameState = 'MENU';
        let currentLevel = 1;
        let player = { x: width / 2, y: height - 80, hp: 100, maxHp: 100, speed: 10, fireCooldown: 0 };
        let bullets = [];
        let enemyFireballs = [];
        let particles = [];
        let impactAnimations = [];

        let anaconda = {
            x: width / 2,
            y: 60,
            hp: 350,
            maxHp: 350,
            speedY: 0.18,
            segments: [],
            length: 20,
            swirlAngle: 0,
            swirlRadius: 280,
            scaleSize: 22,
            spikes: 1,
            colorTheme: 'green',
            fireTimer: 0
        };

        // ============ WEAPON SYSTEM ============
        function getWeaponDetails(lvl) {
            if (lvl === 1) return { name: 'AK-47', damage: 18, rate: 14, type: 'bullet', style: 'ak47',
            flameColor: '#ffcc00' };
            if (lvl === 2) return { name: 'Tactical SMG', damage: 28, rate: 11, type: 'bullet', style: 'smg',
                flameColor: '#00ffcc' };
            if (lvl === 3) return { name: 'Heavy Assault Rifle', damage: 45, rate: 9, type: 'bullet', style: 'assault',
                flameColor: '#ff5500' };
            if (lvl === 4) return { name: 'Quad Gatling Gun', damage: 65, rate: 6, type: 'bullet', style: 'gatling',
                flameColor: '#00ffff' };
            if (lvl === 5) return { name: 'Bazooka MK-I', damage: 120, rate: 22, type: 'missile', style: 'bazooka1',
                flameColor: '#ff2200' };
            if (lvl === 6) return { name: 'Plasma Launcher MK-II', damage: 180, rate: 20, type: 'missile',
                style: 'bazooka2', flameColor: '#bf00ff' };
            if (lvl === 7) return { name: 'Rocket Cannon MK-III', damage: 260, rate: 18, type: 'missile',
                style: 'bazooka3', flameColor: '#ffff00' };
            if (lvl === 8) return { name: 'Quantum Destroyer MK-IV', damage: 370, rate: 16, type: 'missile',
                style: 'bazooka4', flameColor: '#00ff66' };
            if (lvl === 9) return { name: 'Apocalypse Launcher MK-V', damage: 500, rate: 14, type: 'missile',
                style: 'bazooka5', flameColor: '#ff00aa' };

            let scaleFactor = lvl - 9;
            return {
                name: `Doom Cannon MK-${9 + scaleFactor}`,
                damage: 600 + scaleFactor * 150,
                rate: Math.max(6, 13 - scaleFactor),
                type: 'missile',
                style: 'ultimate',
                flameColor: `hsl(${(lvl * 45) % 360}, 100%, 60%)`
            };
        }

        // ============ LEVEL INIT ============
        function initLevel(lvl) {
            currentLevel = lvl;
            player.x = width / 2;

            anaconda.x = width / 2;
            anaconda.y = 60;
            anaconda.swirlAngle = 0;

            let wpn = getWeaponDetails(lvl);

            anaconda.maxHp = 350 + (lvl - 1) * 260;
            anaconda.hp = anaconda.maxHp;
            anaconda.speedY = 0.2 + (lvl * 0.04);

            anaconda.length = Math.min(30, 18 + Math.floor(lvl * 1.3));
            anaconda.scaleSize = Math.min(28, 18 + Math.floor(lvl * 0.7));

            let linearityFactor = Math.max(0.05, 1 - ((lvl - 1) * 0.1));
            anaconda.swirlRadius = Math.max(20, (width * 0.35 - (lvl * 15)) * linearityFactor);

            anaconda.spikes = Math.min(6, 1 + Math.floor(lvl * 0.6));

            if (lvl <= 2) anaconda.colorTheme = 'green';
            else if (lvl <= 4) anaconda.colorTheme = 'crimson';
            else if (lvl <= 7) anaconda.colorTheme = 'dragon_gold';
            else anaconda.colorTheme = 'nether_titan';

            anaconda.segments = [];
            for (let i = 0; i < anaconda.length; i++) {
                anaconda.segments.push({ x: anaconda.x, y: anaconda.y - i * 14 });
            }

            document.getElementById('levelHUD').innerText = `LEVEL ${currentLevel}`;
            document.getElementById('weaponDisplay').innerText = wpn.name;
            document.getElementById('bossHpDisplay').innerText = anaconda.hp;
            document.getElementById('playerHpDisplay').innerText = player.hp;
        }

        // ============ MENU / OVERLAY ============
        function startGame() {
            gameState = 'PLAYING';
            player.hp = player.maxHp;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('fingerIcon').style.display = 'none';
            startHorrorBGM();
            initLevel(1);
            // Hide hint after game starts
            const hint = document.getElementById('touchHint');
            if (hint) { hint.style.opacity = '0';
                setTimeout(() => { if (hint) hint.style.display = 'none'; }, 1000); }
        }

        function restartGame() {
            startGame();
        }

        function exitGame() {
            window.location.reload();
        }

        // ============ GAME OVER ============
        function gameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            playSound('scary_drone');

            const overlay = document.getElementById('overlay');
            const content = document.getElementById('overlayContent');
            const finger = document.getElementById('fingerIcon');
            const btnContainer = document.getElementById('menuBtnContainer');

            overlay.style.display = 'flex';
            finger.style.display = 'none';
            btnContainer.innerHTML = '';

            content.innerHTML = `
            <h1 class="title-glow" style="font-size: clamp(44px,14vw,80px); letter-spacing:4px;">YOU LOST</h1>
          `;

            setTimeout(() => {
                if (gameState !== 'GAMEOVER') return;
                finger.style.display = 'block';
                // === CHANGED TEXT HERE ===
                content.innerHTML = `
                <div class="subtitle-card" style="border-color:#ff3333; margin-top:8px;">
                  <p class="text-main" style="font-size:clamp(18px,4.5vw,28px);">sorri babu 😡🖕</p>
                </div>
              `;

                setTimeout(() => {
                    if (gameState !== 'GAMEOVER') return;
                    finger.style.display = 'none';
                    content.innerHTML = '';
                    overlay.style.background = '#000';

                    setTimeout(() => {
                        if (gameState !== 'GAMEOVER') return;
                        overlay.style.background = 'radial-gradient(circle, rgba(20,0,0,0.96) 0%, rgba(0,0,0,0.99) 100%)';
                        content.innerHTML = `
                          <div style="font-size:clamp(28px,8vw,44px); color:#fff; text-shadow:0 0 20px #ff0000; font-weight:bold; margin-bottom:16px; letter-spacing:5px; border-bottom:2px solid #ff0000; padding-bottom:8px;">GAME OVER</div>
                        `;
                        btnContainer.innerHTML = `
                          <button class="actionBtn" onclick="restartGame()">↻ REPLAY</button>
                          <button class="actionBtn exitBtn" onclick="exitGame()">✕ EXIT</button>
                        `;
                    }, 1000);
                }, 2800);
            }, 2200);
        }

        // ============ UPDATE ============
        function update() {
            if (gameState !== 'PLAYING') return;
            player.y = height - 80;

            // Keyboard movement (still supported)
            if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;
            player.x = Math.max(60, Math.min(width - 60, player.x));

            let wpn = getWeaponDetails(currentLevel);

            // FIRE: from touch OR keyboard
            let shouldFire = false;
            if (isTouching && touchActive) shouldFire = true;
            if (keys['Space']) shouldFire = true;

            if (player.fireCooldown > 0) player.fireCooldown--;
            if (shouldFire && player.fireCooldown <= 0) {
                if (wpn.type === 'missile') {
                    playSound('bazooka');
                    bullets.push({ x: player.x, y: player.y - 70, vx: 0, vy: -18, type: 'missile', damage: wpn.damage,
                        flameColor: wpn.flameColor });
                } else {
                    playSound(currentLevel >= 3 ? 'heavy' : 'gun');
                    let spread = (Math.random() - 0.5) * 4;
                    bullets.push({ x: player.x + spread, y: player.y - 70, vx: spread * 0.2, vy: -28, type: 'bullet',
                        damage: wpn.damage, flameColor: wpn.flameColor });
                }

                for (let f = 0; f < 4; f++) {
                    particles.push({
                        x: player.x + (Math.random() - 0.5) * 18,
                        y: player.y - 75,
                        vx: (Math.random() - 0.5) * 7,
                        vy: (Math.random() - 0.5) * 7 - 2,
                        life: 8,
                        color: wpn.flameColor,
                        radius: Math.random() * 4 + 2
                    });
                }
                player.fireCooldown = wpn.rate;
            }

            // Anaconda movement
            let linearityFactor = Math.max(0.05, 1 - ((currentLevel - 1) * 0.1));
            anaconda.swirlAngle += (0.015 + (currentLevel * 0.002)) * linearityFactor;
            let targetX = (width / 2) + Math.sin(anaconda.swirlAngle) * anaconda.swirlRadius;

            if (currentLevel >= 5) {
                targetX += (player.x - targetX) * Math.min(0.85, 0.2 + (currentLevel * 0.06));
            }

            anaconda.y += anaconda.speedY;
            anaconda.x += (targetX - anaconda.x) * 0.08;

            // Dragon fireballs (level 5+)
            if (currentLevel >= 5) {
                anaconda.fireTimer++;
                let fireInterval = Math.max(35, 100 - (currentLevel * 6));
                if (anaconda.fireTimer >= fireInterval) {
                    anaconda.fireTimer = 0;
                    playSound('fireball');
                    let angle = Math.atan2((player.y - 40) - anaconda.y, player.x - anaconda.x);
                    let fbSpeed = 6 + (currentLevel * 0.45);
                    enemyFireballs.push({
                        x: anaconda.x,
                        y: anaconda.y,
                        vx: Math.cos(angle) * fbSpeed,
                        vy: Math.sin(angle) * fbSpeed,
                        radius: 16,
                        damage: 10 + Math.min(10, Math.floor(currentLevel * 1.5))
                    });
                }
            }

            // Anaconda segment physics
            anaconda.segments[0] = { x: anaconda.x, y: anaconda.y };
            for (let i = 1; i < anaconda.length; i++) {
                let segPrev = anaconda.segments[i - 1];
                let segCurr = anaconda.segments[i];
                let sdx = segPrev.x - segCurr.x;
                let sdy = segPrev.y - segCurr.y;
                let sdist = Math.hypot(sdx, sdy);
                let spacing = anaconda.scaleSize * 0.65;
                if (sdist > spacing) {
                    segCurr.x = segPrev.x - (sdx / sdist) * spacing;
                    segCurr.y = segPrev.y - (sdy / sdist) * spacing;
                }
            }

            // Collision: anaconda reaches player
            if (anaconda.y >= height - 110 || Math.hypot(anaconda.x - player.x, anaconda.y - player.y) < (anaconda
                    .scaleSize + 25)) {
                gameOver();
                return;
            }

            // Enemy fireballs vs player
            for (let i = enemyFireballs.length - 1; i >= 0; i--) {
                let fb = enemyFireballs[i];
                fb.x += fb.vx;
                fb.y += fb.vy;

                if (Math.hypot(fb.x - player.x, fb.y - (player.y - 30)) < 38) {
                    player.hp -= fb.damage;
                    playSound('hit');
                    document.getElementById('playerHpDisplay').innerText = Math.max(0, player.hp);

                    for (let p = 0; p < 10; p++) {
                        particles.push({
                            x: fb.x,
                            y: fb.y,
                            vx: (Math.random() - 0.5) * 9,
                            vy: (Math.random() - 0.5) * 9,
                            life: 12,
                            color: '#ff2200',
                            radius: Math.random() * 4 + 2
                        });
                    }
                    enemyFireballs.splice(i, 1);
                    if (player.hp <= 0) { gameOver(); return; }
                    continue;
                }
                if (fb.y > height || fb.x < 0 || fb.x > width) {
                    enemyFireballs.splice(i, 1);
                }
            }

            // Bullets vs anaconda
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                let hit = false;
                for (let j = 0; j < anaconda.segments.length; j++) {
                    let seg = anaconda.segments[j];
                    if (Math.hypot(b.x - seg.x, b.y - seg.y) < (anaconda.scaleSize + (b.type === 'missile' ? 18 :
                            0))) {
                        anaconda.hp -= b.damage;
                        document.getElementById('bossHpDisplay').innerText = Math.max(0, anaconda.hp);

                        impactAnimations.push({
                            x: b.x,
                            y: b.y,
                            radius: 4,
                            maxRadius: b.type === 'missile' ? 55 : 28,
                            alpha: 1.0,
                            color: b.flameColor
                        });

                        for (let p = 0; p < (b.type === 'missile' ? 14 : 5); p++) {
                            particles.push({
                                x: b.x,
                                y: b.y,
                                vx: (Math.random() - 0.5) * 14,
                                vy: (Math.random() - 0.5) * 14,
                                life: 15,
                                color: b.flameColor,
                                radius: Math.random() * 4 + 2
                            });
                        }
                        hit = true;
                        break;
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                    if (anaconda.hp <= 0) {
                        initLevel(currentLevel + 1);
                    }
                    continue;
                }
                if (b.y < 0 || b.x < 0 || b.x > width) bullets.splice(i, 1);
            }

            // Impact animations
            for (let i = impactAnimations.length - 1; i >= 0; i--) {
                let anim = impactAnimations[i];
                anim.radius += 2.5;
                anim.alpha -= 0.06;
                if (anim.alpha <= 0 || anim.radius >= anim.maxRadius) impactAnimations.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ============ DRAWING ============
        function drawTempleBG() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#0f0502');
            skyGrad.addColorStop(0.5, '#4a1505');
            skyGrad.addColorStop(1, '#1a0802');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 60, 0, 0.06)';
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(width * 0.16 * i, 0);
                ctx.lineTo(width * 0.16 * i + 150, height);
                ctx.lineTo(width * 0.16 * i + 40, height);
                ctx.fill();
            }

            ctx.fillStyle = '#261205';
            for (let i = 0; i <= width + 100; i += 220) {
                ctx.fillRect(i - 40, 0, 80, height);
                ctx.fillStyle = '#140a02';
                ctx.fillRect(i - 30, 0, 20, height);
                ctx.fillStyle = '#3d1d08';
                ctx.fillRect(i + 10, 0, 12, height);
                ctx.fillStyle = '#261205';
            }

            ctx.fillStyle = '#0d0502';
            ctx.fillRect(0, height - 90, width, 90);
            ctx.fillStyle = '#4a1a05';
            ctx.fillRect(0, height - 90, width, 10);
        }

        function draw() {
            drawTempleBG();

            if (gameState === 'PLAYING') {
                // === ANACONDA ===
                for (let i = anaconda.segments.length - 1; i >= 0; i--) {
                    let seg = anaconda.segments[i];
                    let radius = Math.max(12, anaconda.scaleSize - i * 0.25);

                    ctx.save();
                    ctx.translate(seg.x, seg.y);

                    let mainColor = '#193d08',
                        innerColor = '#327012';
                    if (anaconda.colorTheme === 'crimson') { mainColor = '#4a0000';
                        innerColor = '#e60000'; } else if (anaconda.colorTheme === 'dragon_gold') { mainColor =
                            '#593800';
                        innerColor = '#ffbb00'; } else if (anaconda.colorTheme === 'nether_titan') { mainColor =
                            '#1a0033';
                        innerColor = '#ff00aa'; }

                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = innerColor;
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    let spikeCount = anaconda.spikes;
                    if (i < anaconda.segments.length * 0.9 && i % 2 === 0) {
                        ctx.fillStyle = innerColor;
                        for (let s = 0; s < spikeCount; s++) {
                            let angleOffset = (s - (spikeCount - 1) / 2) * 0.45;
                            ctx.save();
                            ctx.rotate(angleOffset);
                            ctx.beginPath();
                            ctx.moveTo(-radius * 0.6, 0);
                            ctx.lineTo(0, -radius - (12 + currentLevel * 2));
                            ctx.lineTo(radius * 0.6, 0);
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    if (i === 0) {
                        // Eyes
                        ctx.fillStyle = currentLevel >= 5 ? '#ffea00' : '#ff2200';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(-radius * 0.45, -6, 6, 0, Math.PI * 2);
                        ctx.arc(radius * 0.45, -6, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // Horns
                        ctx.fillStyle = currentLevel >= 5 ? '#ff5500' : '#ffcc00';
                        ctx.beginPath();
                        ctx.moveTo(-radius * 0.4, -radius);
                        ctx.lineTo(-radius * 0.95, -radius - (25 + currentLevel * 3));
                        ctx.lineTo(-radius * 0.1, -radius);
                        ctx.moveTo(radius * 0.4, -radius);
                        ctx.lineTo(radius * 0.95, -radius - (25 + currentLevel * 3));
                        ctx.lineTo(radius * 0.1, -radius);
                        ctx.fill();

                        // Fangs
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.moveTo(-9, radius);
                        ctx.lineTo(-5, radius + 14);
                        ctx.lineTo(-2, radius);
                        ctx.moveTo(2, radius);
                        ctx.lineTo(5, radius + 14);
                        ctx.lineTo(9, radius);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // === ENEMY FIREBALLS ===
                enemyFireballs.forEach(fb => {
                    ctx.save();
                    ctx.fillStyle = currentLevel >= 5 ? '#ff3300' : '#ff5500';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(fb.x, fb.y, fb.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(fb.x, fb.y, fb.radius * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                });

                // === BULLETS ===
                bullets.forEach(b => {
                    ctx.save();
                    if (b.type === 'missile') {
                        ctx.fillStyle = b.flameColor;
                        ctx.shadowColor = b.flameColor;
                        ctx.shadowBlur = 12;
                        ctx.fillRect(b.x - 6, b.y - 18, 12, 36);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(b.x - 2, b.y + 18, 4, 14);
                    } else {
                        ctx.fillStyle = b.flameColor;
                        ctx.shadowColor = b.flameColor;
                        ctx.shadowBlur = 10;
                        ctx.fillRect(b.x - 2, b.y - 14, 5, 28);
                    }
                    ctx.restore();
                });

                // === IMPACT ANIMATIONS ===
                impactAnimations.forEach(anim => {
                    ctx.save();
                    ctx.strokeStyle = anim.color;
                    ctx.lineWidth = 3.5;
                    ctx.globalAlpha = anim.alpha;
                    ctx.beginPath();
                    ctx.arc(anim.x, anim.y, anim.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });

                // === PARTICLES ===
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // === PLAYER / GUN ===
                ctx.save();
                ctx.translate(player.x, player.y);

                let wpnStyle = getWeaponDetails(currentLevel).style;

                if (wpnStyle === 'ak47') {
                    ctx.fillStyle = '#4a2f1d';
                    ctx.fillRect(-18, 0, 10, 25);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(-22, -25, 44, 18);
                    ctx.fillStyle = '#5c3a21';
                    ctx.fillRect(-16, -55, 10, 32);
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.moveTo(-4, -10);
                    ctx.lineTo(-12, 15);
                    ctx.lineTo(-2, 18);
                    ctx.lineTo(2, -10);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(-4, -75, 6, 52);
                } else if (wpnStyle === 'smg') {
                    ctx.fillStyle = '#2b2b2b';
                    ctx.fillRect(-18, -10, 36, 25);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-6, 0, 10, 30);
                    ctx.fillRect(-3, -60, 6, 50);
                } else if (wpnStyle === 'assault') {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-24, -18, 48, 25);
                    ctx.fillStyle = '#151515';
                    ctx.fillRect(-8, 5, 12, 28);
                    ctx.fillRect(-4, -68, 8, 52);
                } else if (wpnStyle === 'gatling') {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(-35, 5, 70, 30);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-25, -20, 50, 25);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-18, -65, 6, 48);
                    ctx.fillRect(-6, -72, 6, 55);
                    ctx.fillRect(6, -72, 6, 55);
                    ctx.fillRect(12, -65, 6, 48);
                } else {
                    ctx.fillStyle = '#3b4a22';
                    ctx.fillRect(-20, -65, 40, 65);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(-28, -35, 12, 8);
                    ctx.fillRect(-8, 0, 16, 25);
                    ctx.fillStyle = '#ff4400';
                    ctx.fillRect(-6, -72, 12, 10);
                }
                ctx.restore();
            }

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        draw();
    </script>
