<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anaconda and Suck - Ultimate Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
    touch-action: none;
  }
  #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #levelHUD { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 42px; font-weight: 900; color: rgba(255, 255, 255, 0.18); font-family: 'Courier New', monospace; pointer-events: none; letter-spacing: 2px; text-transform: uppercase; }
  #weaponHUD { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-family: 'Courier New', monospace; font-size: 16px; color: #00ffcc; background: rgba(0,0,0,0.6); padding: 8px 14px; border-left: 3px solid #00ffcc; border-radius: 4px; pointer-events: none; }
  #healthHUD { position: absolute; top: 15px; right: 20px; z-index: 10; font-family: 'Courier New', monospace; font-size: 18px; color: #fff; text-align: right; line-height: 1.5; background: rgba(0,0,0,0.6); padding: 10px 15px; border-right: 4px solid #ff4444; border-radius: 4px; pointer-events: none; }

  #fullscreenBtn { position: absolute; bottom: 20px; right: 20px; z-index: 20; padding: 8px 16px; background: rgba(255,215,0,0.2); color: #ffd700; border: 1px solid #ffd700; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; font-size: 12px; transition: all 0.2s; }
  #fullscreenBtn:hover { background: #ffd700; color: #000; }

  #gyroBtn { position: absolute; bottom: 70px; right: 20px; z-index: 20; padding: 8px 16px; background: rgba(0,255,204,0.18); color: #00ffcc; border: 1px solid #00ffcc; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; font-size: 12px; transition: all 0.2s; }
  #gyroBtn:hover { background: rgba(0,255,204,0.4); }

  #shootBtn { position: absolute; bottom: 70px; left: 20px; z-index: 20; padding: 18px 26px; background: rgba(255,68,68,0.22); color: #fff; border: 2px solid #ff4444; font-weight: 900; cursor: pointer; border-radius: 50px; font-size: 18px; touch-action: manipulation; }
  #shootBtn:active { transform: scale(0.96); }

  #overlay {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle, rgba(20,0,0,0.96) 0%, rgba(0,0,0,0.99) 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 30; text-align: center; padding: 25px;
  }

  .title-glow { font-size: 60px; color: #ff1a1a; text-shadow: 0 0 30px #ff0000, 0 0 60px #800000; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; }
  .subtitle-card { background: rgba(255, 0, 0, 0.08); border: 1px solid rgba(255, 0, 0, 0.3); padding: 14px 28px; border-radius: 8px; margin: 12px 0; max-width: 750px; box-shadow: 0 0 25px rgba(255,0,0,0.12); }
  .text-main { font-size: 24px; color: #ffcccc; font-weight: bold; letter-spacing: 1px; }

  #fingerIcon { font-size: 90px; margin: 15px 0; text-shadow: 0 0 35px #ff0000; animation: pulse 1.1s infinite ease-in-out; display: none; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.22) rotate(-8deg); } 100% { transform: scale(1); } }

  .btn-container { display: flex; gap: 20px; margin-top: 20px; }
  .actionBtn { padding: 14px 38px; font-size: 20px; background: linear-gradient(135deg, #ff1a1a, #800000); color: #fff; border: 2px solid #ffd700; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 6px; box-shadow: 0 0 25px rgba(255,0,0,0.6); transition: all 0.2s ease; }
  .actionBtn:hover { background: linear-gradient(135deg, #ffd700, #ff8800); color: #000; box-shadow: 0 0 35px #ffd700; transform: scale(1.06); }
  .exitBtn { background: linear-gradient(135deg, #333, #111); border-color: #aaa; }
  .exitBtn:hover { background: #fff; color: #000; border-color: #fff; }
</style>
</head>
<body>

<div id="levelHUD">LEVEL 1</div>
<div id="weaponHUD">WEAPON: <span id="weaponDisplay" style="color: #fff;">AK-47</span></div>
<div id="healthHUD">
  <div>SUCKS HP: <span id="playerHpDisplay" style="color: #00ffcc;">100</span> / 100</div>
  <div>ANACONDA HP: <span id="bossHpDisplay" style="color: #ff4444;">350</span></div>
</div>

<button id="fullscreenBtn" onclick="toggleFullScreen()">Full Screen</button>
<button id="gyroBtn" onclick="enableGyro()">GYRO ON</button>
<button id="shootBtn" ontouchstart="shootFromButton()" onmousedown="shootFromButton()">SHOOT</button>

<div id="overlay">
  <div id="overlayContent">
    <h1 class="title-glow">ANACONDA AND SUCK</h1>
    <div class="subtitle-card">
      <p class="text-main">Face the ever-evolving Dragon-Anaconda titan across infinite levels! Level 5+ unleashes deadly dragon fire and terrifying linear assaults.</p>
    </div>
  </div>
  <div id="fingerIcon">🖕</div>
  <div class="btn-container" id="menuBtnContainer">
    <button class="actionBtn" onclick="startGame()">START GAME</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  if (player) {
    player.y = height - 80;
    if (player.x > width - 60) player.x = width - 60;
  }
}
window.addEventListener('resize', resize);
resize();

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let bgmInterval = null;

function startHorrorBGM() {
  if (bgmInterval) clearInterval(bgmInterval);
  if (audioCtx.state === 'suspended') audioCtx.resume();

  let beat = 0;
  bgmInterval = setInterval(() => {
    if (gameState !== 'PLAYING') return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const droneNotes = [45, 48.5, 42, 38];

    osc.frequency.setValueAtTime(droneNotes[beat % droneNotes.length], audioCtx.currentTime);
    osc.type = 'sawtooth';

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.3);
    beat++;
  }, 900);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  if (type === 'gun') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
  } else if (type === 'heavy') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  } else if (type === 'bazooka') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  } else if (type === 'fireball') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
  } else if (type === 'hit') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  } else if (type === 'scary_drone') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.8);
    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);
  }

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.8);
}

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

let gameState = 'MENU';
let currentLevel = 1;
let player = { x: width / 2, y: height - 80, hp: 100, maxHp: 100, speed: 10, fireCooldown: 0 };
let bullets = [];
let enemyFireballs = [];
let particles = [];
let impactAnimations = [];

let anaconda = {
  x: width / 2, y: 60, hp: 350, maxHp: 350, speedY: 0.18, segments: [], length: 20,
  swirlAngle: 0, swirlRadius: 280, scaleSize: 22, spikes: 1, colorTheme: 'green',
  fireTimer: 0
};

let gyroEnabled = false;
let gyroTargetX = 0;
let gyroX = 0;
let touchMoveActive = false;
let touchStartX = 0;
let touchPlayerStartX = 0;

function enableGyro() {
  const activate = () => {
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
    gyroEnabled = true;
    document.getElementById('gyroBtn').innerText = 'GYRO ON';
  };

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(permissionState => {
      if (permissionState === 'granted') activate();
    }).catch(() => {});
  } else {
    activate();
  }
}

function onDeviceOrientation(e) {
  if (e.gamma == null) return;
  gyroTargetX = e.gamma;
}

function shootFromButton() {
  if (gameState !== 'PLAYING') return;
  if (player.fireCooldown > 0) return;

  const wpn = getWeaponDetails(currentLevel);
  if (wpn.type === 'missile') {
    playSound('bazooka');
    bullets.push({ x: player.x, y: player.y - 70, vx: 0, vy: -18, type: 'missile', damage: wpn.damage, flameColor: wpn.flameColor });
  } else {
    playSound(currentLevel >= 3 ? 'heavy' : 'gun');
    let spread = (Math.random() - 0.5) * 4;
    bullets.push({ x: player.x + spread, y: player.y - 70, vx: spread * 0.2, vy: -28, type: 'bullet', damage: wpn.damage, flameColor: wpn.flameColor });
  }

  for (let f = 0; f < 4; f++) {
    particles.push({
      x: player.x + (Math.random() - 0.5) * 18, y: player.y - 75,
      vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7 - 2,
      life: 8, color: wpn.flameColor, radius: Math.random() * 4 + 2
    });
  }

  player.fireCooldown = wpn.rate;
}

canvas.addEventListener('touchstart', e => {
  if (!e.touches || !e.touches[0]) return;
  touchMoveActive = true;
  touchStartX = e.touches[0].clientX;
  touchPlayerStartX = player.x;
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (!touchMoveActive || !e.touches || !e.touches[0]) return;
  const dx = e.touches[0].clientX - touchStartX;
  player.x = touchPlayerStartX + dx * 1.2;
}, { passive: true });

canvas.addEventListener('touchend', () => {
  touchMoveActive = false;
}, { passive: true });

function getWeaponDetails(lvl) {
  if (lvl === 1) return { name: 'AK-47', damage: 18, rate: 14, type: 'bullet', style: 'ak47', flameColor: '#ffcc00' };
  if (lvl === 2) return { name: 'Tactical Submachine Gun', damage: 28, rate: 11, type: 'bullet', style: 'smg', flameColor: '#00ffcc' };
  if (lvl === 3) return { name: 'Heavy Assault Rifle', damage: 45, rate: 9, type: 'bullet', style: 'assault', flameColor: '#ff5500' };
  if (lvl === 4) return { name: 'Quad-Barrel Gatling Gun', damage: 65, rate: 6, type: 'bullet', style: 'gatling', flameColor: '#00ffff' };
  if (lvl === 5) return { name: 'Standard Bazooka MK-I', damage: 120, rate: 22, type: 'missile', style: 'bazooka1', flameColor: '#ff2200' };
  if (lvl === 6) return { name: 'Advanced Plasma Launcher MK-II', damage: 180, rate: 20, type: 'missile', style: 'bazooka2', flameColor: '#bf00ff' };
  if (lvl === 7) return { name: 'Hyper-Velocity Rocket Cannon MK-III', damage: 260, rate: 18, type: 'missile', style: 'bazooka3', flameColor: '#ffff00' };
  if (lvl === 8) return { name: 'Quantum Destroyer Cannon MK-IV', damage: 370, rate: 16, type: 'missile', style: 'bazooka4', flameColor: '#00ff66' };
  if (lvl === 9) return { name: 'Apocalypse Titan Launcher MK-V', damage: 500, rate: 14, type: 'missile', style: 'bazooka5', flameColor: '#ff00aa' };
  let scaleFactor = lvl - 9;
  return { name: `Infinite Doom Cannon MK-${9 + scaleFactor}`, damage: 600 + scaleFactor * 150, rate: Math.max(6, 13 - scaleFactor), type: 'missile', style: 'ultimate', flameColor: `hsl(${(lvl * 45) % 360}, 100%, 60%)` };
}

function initLevel(lvl) {
  currentLevel = lvl;
  player.x = width / 2;
  anaconda.x = width / 2;
  anaconda.y = 60;
  anaconda.swirlAngle = 0;

  let wpn = getWeaponDetails(lvl);

  anaconda.maxHp = 350 + (lvl - 1) * 260;
  anaconda.hp = anaconda.maxHp;
  anaconda.speedY = 0.2 + (lvl * 0.04);

  anaconda.length = Math.min(30, 18 + Math.floor(lvl * 1.3));
  anaconda.scaleSize = Math.min(28, 18 + Math.floor(lvl * 0.7));

  let linearityFactor = Math.max(0.05, 1 - ((lvl - 1) * 0.1));
  anaconda.swirlRadius = Math.max(20, (width * 0.35 - (lvl * 15)) * linearityFactor);

  anaconda.spikes = Math.min(6, 1 + Math.floor(lvl * 0.6));

  if (lvl <= 2) {
    anaconda.colorTheme = 'green';
  } else if (lvl <= 4) {
    anaconda.colorTheme = 'crimson';
  } else if (lvl <= 7) {
    anaconda.colorTheme = 'dragon_gold';
  } else {
    anaconda.colorTheme = 'nether_titan';
  }

  anaconda.segments = [];
  for (let i = 0; i < anaconda.length; i++) {
    anaconda.segments.push({ x: anaconda.x, y: anaconda.y - i * 14 });
  }

  document.getElementById('levelHUD').innerText = `LEVEL ${currentLevel}`;
  document.getElementById('weaponDisplay').innerText = wpn.name;
  document.getElementById('bossHpDisplay').innerText = anaconda.hp;
  document.getElementById('playerHpDisplay').innerText = player.hp;
}

function startGame() {
  gameState = 'PLAYING';
  player.hp = player.maxHp;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('fingerIcon').style.display = 'none';
  startHorrorBGM();
  initLevel(1);
}

function restartGame() { startGame(); }
function exitGame() { window.location.reload(); }

function gameOver() {
  gameState = 'GAMEOVER';
  stopBGM();
  playSound('scary_drone');

  const overlay = document.getElementById('overlay');
  const content = document.getElementById('overlayContent');
  const finger = document.getElementById('fingerIcon');
  const btnContainer = document.getElementById('menuBtnContainer');

  overlay.style.display = 'flex';
  finger.style.display = 'none';
  btnContainer.innerHTML = '';

  content.innerHTML = `<h1 class="title-glow" style="font-size: 72px; letter-spacing: 6px;">YOU LOST</h1>`;

  setTimeout(() => {
    if (gameState !== 'GAMEOVER') return;
    finger.style.display = 'block';
    content.innerHTML = `
      <div class="subtitle-card" style="border-color: #ff3333; margin-top: 10px;">
        <p class="text-main" style="font-size: 26px;">Anaconda is the eternal villain of Sucks' life</p>
      </div>
    `;

    setTimeout(() => {
      if (gameState !== 'GAMEOVER') return;
      finger.style.display = 'none';
      content.innerHTML = '';
      overlay.style.background = '#000';

      setTimeout(() => {
        if (gameState !== 'GAMEOVER') return;
        overlay.style.background = 'radial-gradient(circle, rgba(20,0,0,0.96) 0%, rgba(0,0,0,0.99) 100%)';
        content.innerHTML = `
          <div style="font-size: 38px; color: #fff; text-shadow: 0 0 20px #ff0000; font-weight: bold; margin-bottom: 20px; letter-spacing: 5px; border-bottom: 2px solid #ff0000; padding-bottom: 8px;">GAME OVER</div>
        `;
        btnContainer.innerHTML = `
          <button class="actionBtn" onclick="restartGame()">REPLAY</button>
          <button class="actionBtn exitBtn" onclick="exitGame()">EXIT</button>
        `;
      }, 1000);
    }, 3000);
  }, 2500);
}

function update() {
  if (gameState !== 'PLAYING') return;
  player.y = height - 80;

  if (gyroEnabled) {
    gyroX += (gyroTargetX - gyroX) * 0.08;
    player.x += gyroX * 0.45;
  } else {
    if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
    if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;
  }

  if (player.x < 60) player.x = 60;
  if (player.x > width - 60) player.x = width - 60;

  let wpn = getWeaponDetails(currentLevel);

  if (player.fireCooldown > 0) player.fireCooldown--;
  if (keys['Space'] && player.fireCooldown <= 0) {
    if (wpn.type === 'missile') {
      playSound('bazooka');
      bullets.push({ x: player.x, y: player.y - 70, vx: 0, vy: -18, type: 'missile', damage: wpn.damage, flameColor: wpn.flameColor });
    } else {
      playSound(currentLevel >= 3 ? 'heavy' : 'gun');
      let spread = (Math.random() - 0.5) * 4;
      bullets.push({ x: player.x + spread, y: player.y - 70, vx: spread * 0.2, vy: -28, type: 'bullet', damage: wpn.damage, flameColor: wpn.flameColor });
    }

    for (let f = 0; f < 4; f++) {
      particles.push({
        x: player.x + (Math.random() - 0.5) * 18, y: player.y - 75,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7 - 2,
        life: 8, color: wpn.flameColor, radius: Math.random() * 4 + 2
      });
    }
    player.fireCooldown = wpn.rate;
  }

  let linearityFactor = Math.max(0.05, 1 - ((currentLevel - 1) * 0.1));
  anaconda.swirlAngle += (0.015 + (currentLevel * 0.002)) * linearityFactor;
  let targetX = (width / 2) + Math.sin(anaconda.swirlAngle) * anaconda.swirlRadius;

  if (currentLevel >= 5) {
    targetX += (player.x - targetX) * Math.min(0.85, 0.2 + (currentLevel * 0.06));
  }

  anaconda.y += anaconda.speedY;
  anaconda.x += (targetX - anaconda.x) * 0.08;

  if (currentLevel >= 5) {
    anaconda.fireTimer++;
    let fireInterval = Math.max(35, 100 - (currentLevel * 6));
    if (anaconda.fireTimer >= fireInterval) {
      anaconda.fireTimer = 0;
      playSound('fireball');
      let angle = Math.atan2((player.y - 40) - anaconda.y, player.x - anaconda.x);
      let fbSpeed = 6 + (currentLevel * 0.45);
      enemyFireballs.push({
        x: anaconda.x, y: anaconda.y,
        vx: Math.cos(angle) * fbSpeed, vy: Math.sin(angle) * fbSpeed,
        radius: 16, damage: 10 + Math.min(10, Math.floor(currentLevel * 1.5))
      });
    }
  }

  anaconda.segments[0] = { x: anaconda.x, y: anaconda.y };
  for (let i = 1; i < anaconda.length; i++) {
    let segPrev = anaconda.segments[i - 1];
    let segCurr = anaconda.segments[i];
    let sdx = segPrev.x - segCurr.x;
    let sdy = segPrev.y - segCurr.y;
    let sdist = Math.hypot(sdx, sdy);
    let spacing = anaconda.scaleSize * 0.65;
    if (sdist > spacing) {
      segCurr.x = segPrev.x - (sdx / sdist) * spacing;
      segCurr.y = segPrev.y - (sdy / sdist) * spacing;
    }
  }

  if (anaconda.y >= height - 110 || Math.hypot(anaconda.x - player.x, anaconda.y - player.y) < (anaconda.scaleSize + 25)) {
    gameOver();
    return;
  }

  for (let i = enemyFireballs.length - 1; i >= 0; i--) {
    let fb = enemyFireballs[i];
    fb.x += fb.vx;
   fb.y += fb.vy;

    if (Math.hypot(fb.x - player.x, fb.y - player.y) < fb.radius + 20) {
      playSound('hit');
      player.hp -= fb.damage;
      document.getElementById('playerHpDisplay').innerText = Math.max(0, player.hp);
      
      for (let p = 0; p < 8; p++) {
        particles.push({
          x: fb.x, y: fb.y,
          vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          life: 12, color: '#ff4400', radius: Math.random() * 5 + 2
        });
      }

      enemyFireballs.splice(i, 1);
      if (player.hp <= 0) {
        gameOver();
        return;
      }
      continue;
    }

    if (fb.y > height + 50 || fb.x < -50 || fb.x > width + 50) {
      enemyFireballs.splice(i, 1);
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;

    let hitAnaconda = false;
    for (let s = 0; s < anaconda.segments.length; s++) {
      let seg = anaconda.segments[s];
      if (Math.hypot(b.x - seg.x, b.y - seg.y) < anaconda.scaleSize * 0.8) {
        hitAnaconda = true;
        break;
      }
    }

    if (hitAnaconda) {
      playSound('hit');
      anaconda.hp -= b.damage;
      document.getElementById('bossHpDisplay').innerText = Math.max(0, anaconda.hp);

      impactAnimations.push({ x: b.x, y: b.y, radius: 10, maxRadius: 35, life: 10, color: b.flameColor });

      for (let p = 0; p < 5; p++) {
        particles.push({
          x: b.x, y: b.y,
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
          life: 10, color: b.flameColor, radius: Math.random() * 3 + 2
        });
      }

      bullets.splice(i, 1);

      if (anaconda.hp <= 0) {
        initLevel(currentLevel + 1);
      }
      continue;
    }

    if (b.y < -30 || b.x < -30 || b.x > width + 30) {
      bullets.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  for (let i = impactAnimations.length - 1; i >= 0; i--) {
    let ia = impactAnimations[i];
    ia.radius += (ia.maxRadius - ia.radius) * 0.2;
    ia.life--;
    if (ia.life <= 0) impactAnimations.splice(i, 1);
  }
}

function render() {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  for (let y = 0; y < height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }

  for (let ia of impactAnimations) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(ia.x, ia.y, ia.radius, 0, Math.PI * 2);
    ctx.strokeStyle = ia.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = ia.life / 10;
    ctx.stroke();
    ctx.restore();
  }

  for (let pt of particles) {
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let b of bullets) {
    ctx.save();
    ctx.fillStyle = b.flameColor;
    ctx.shadowBlur = 12;
    ctx.shadowColor = b.flameColor;
    if (b.type === 'missile') {
      ctx.fillRect(b.x - 4, b.y - 12, 8, 24);
    } else {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for (let fb of enemyFireballs) {
    ctx.save();
    ctx.fillStyle = '#ff3300';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff0000';
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, fb.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let head = anaconda.segments[0];
  ctx.save();
  ctx.translate(head.x, head.y);
  let nextSeg = anaconda.segments[1] || head;
  let angle = Math.atan2(nextSeg.y - head.y, nextSeg.x - head.x);
  ctx.rotate(angle + Math.PI / 2);

  let primaryColor = '#00aa33', secondaryColor = '#00ff55';
  if (anaconda.colorTheme === 'crimson') { primaryColor = '#880000'; secondaryColor = '#ff2222'; }
  else if (anaconda.colorTheme === 'dragon_gold') { primaryColor = '#aa8800'; secondaryColor = '#ffdd00'; }
  else if (anaconda.colorTheme === 'nether_titan') { primaryColor = '#4400aa'; secondaryColor = '#aa00ff'; }

  ctx.fillStyle = primaryColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, anaconda.scaleSize, anaconda.scaleSize * 1.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = secondaryColor;
  ctx.stroke();

  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.arc(-anaconda.scaleSize * 0.4, -anaconda.scaleSize * 0.4, 4, 0, Math.PI * 2);
  ctx.arc(anaconda.scaleSize * 0.4, -anaconda.scaleSize * 0.4, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  for (let i = anaconda.segments.length - 1; i > 0; i--) {
    let seg = anaconda.segments[i];
    ctx.save();
    ctx.translate(seg.x, seg.y);
    ctx.fillStyle = (i % 2 === 0) ? primaryColor : '#111';
    ctx.beginPath();
    let sz = anaconda.scaleSize * (1 - (i / anaconda.segments.length) * 0.3);
    ctx.arc(0, 0, sz, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = secondaryColor;
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = '#00ffcc';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00ffcc';

  ctx.beginPath();
  ctx.moveTo(0, -45);
  ctx.lineTo(-20, 25);
  ctx.lineTo(20, 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect(-4, -20, 8, 35);

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
