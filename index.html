<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anaconda and Suck Mobile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  
  /* Top HUD */
  #hud { position: absolute; top: 10px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; color: #fff; font-weight: bold; font-size: 14px; z-index: 10; pointer-events: none; }

  /* Touch Controls Overlay for Mobile */
  #controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 20; }
  .touch-btn { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.2); border: 2px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 22px; font-weight: bold; }
  .touch-btn:active { background: rgba(255, 255, 255, 0.6); transform: scale(0.95); }
  #fireBtn { width: 90px; height: 90px; background: rgba(255, 0, 0, 0.5); border-color: #ff4444; color: #fff; }
  #fireBtn:active { background: rgba(255, 0, 0, 0.9); }

  /* Overlay */
  #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; text-align: center; }
  #startBtn { padding: 15px 30px; font-size: 20px; background: #ff2222; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

<div id="hud">
  <div>LEVEL: <span id="lvl">1</span></div>
  <div>ANACONDA: <span id="hp">350</span></div>
</div>

<div id="overlay">
  <h1>ANACONDA AND SUCK</h1>
  <p style="margin-top:10px; color:#aaa;">Use On-Screen Buttons OR Tilt Phone</p>
  <button id="startBtn" onclick="initGame()">PLAY NOW</button>
</div>

<div id="controls" style="display:none;">
  <div style="display:flex; gap:15px;">
    <div class="touch-btn" id="leftBtn">◀</div>
    <div class="touch-btn" id="rightBtn">▶</div>
  </div>
  <div class="touch-btn" id="fireBtn">🔥</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let player = { x: 0, y: 0, speed: 7 };
let bullets = [];
let anaconda = { x: 0, y: 50, hp: 350, maxHp: 350, speedY: 0.3, dir: 1 };
let gameActive = false;

// Control States
let moveLeft = false;
let moveRight = false;
let isShooting = false;
let lastShootTime = 0;

// Setup Touch Buttons directly
function setupTouchButton(id, onPress, onRelease) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); }, {passive: false});
  btn.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); }, {passive: false});
  btn.addEventListener('mousedown', onPress);
  btn.addEventListener('mouseup', onRelease);
}

setupTouchButton('leftBtn', () => moveLeft = true, () => moveLeft = false);
setupTouchButton('rightBtn', () => moveRight = true, () => moveRight = false);
setupTouchButton('fireBtn', () => isShooting = true, () => isShooting = false);

// Gyroscope Motion Backup
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma) {
    if (e.gamma < -5) { moveLeft = true; moveRight = false; }
    else if (e.gamma > 5) { moveRight = true; moveLeft = false; }
    else { moveLeft = false; moveRight = false; }
  }
});

function initGame() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  
  // Try requesting Gyro permissions explicitly on iOS
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().catch(() => {});
  }

  player.x = width / 2;
  player.y = height - 120;
  anaconda.x = width / 2;
  gameActive = true;
  gameLoop();
}

function update() {
  if (!gameActive) return;

  // Player Movement
  if (moveLeft && player.x > 30) player.x -= player.speed;
  if (moveRight && player.x < width - 30) player.x += player.speed;

  // Shooting Mechanism
  const now = Date.now();
  if (isShooting && now - lastShootTime > 150) {
    bullets.push({ x: player.x, y: player.y - 30, vy: -12 });
    lastShootTime = now;
  }

  // Update Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy;
    
    // Collision check with Anaconda
    if (Math.hypot(bullets[i].x - anaconda.x, bullets[i].y - anaconda.y) < 35) {
      anaconda.hp -= 15;
      document.getElementById('hp').innerText = Math.max(0, anaconda.hp);
      bullets.splice(i, 1);

      if (anaconda.hp <= 0) {
        alert("YOU WON!");
        location.reload();
      }
      continue;
    }

    if (bullets[i].y < 0) bullets.splice(i, 1);
  }

  // Update Anaconda Movement
  anaconda.x += anaconda.dir * 2;
  anaconda.y += anaconda.speedY;

  if (anaconda.x < 40 || anaconda.x > width - 40) anaconda.dir *= -1;

  if (anaconda.y > height - 140) {
    gameActive = false;
    alert("GAME OVER! Anaconda caught you.");
    location.reload();
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, width, height);

  if (!gameActive) return;

  // Draw Player ("Suck")
  ctx.fillStyle = '#00ffcc';
  ctx.beginPath();
  ctx.arc(player.x, player.y, 20, 0, Math.PI * 2);
  ctx.fill();

  // Draw Bullets
  ctx.fillStyle = '#ffcc00';
  for (let b of bullets) {
    ctx.fillRect(b.x - 3, b.y, 6, 12);
  }

  // Draw Anaconda Head
  ctx.fillStyle = '#ff2222';
  ctx.beginPath();
  ctx.arc(anaconda.x, anaconda.y, 30, 0, Math.PI * 2);
  ctx.fill();
}

function gameLoop() {
  update();
  draw();
  if (gameActive) requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
