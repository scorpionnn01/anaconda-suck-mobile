<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anaconda and Suck - Mobile Ultimate Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  
  /* Top HUD Elements */
  #levelHUD { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 32px; font-weight: 900; color: rgba(255, 255, 255, 0.22); font-family: 'Courier New', monospace; pointer-events: none; letter-spacing: 2px; text-transform: uppercase; }
  #weaponHUD { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-family: 'Courier New', monospace; font-size: 14px; color: #00ffcc; background: rgba(0,0,0,0.6); padding: 8px 12px; border-left: 3px solid #00ffcc; border-radius: 4px; pointer-events: none; }
  #healthHUD { position: absolute; top: 15px; right: 20px; z-index: 10; font-family: 'Courier New', monospace; font-size: 15px; color: #fff; text-align: right; line-height: 1.4; background: rgba(0,0,0,0.6); padding: 8px 12px; border-right: 4px solid #ff4444; border-radius: 4px; pointer-events: none; }
  
  /* Mobile Fire Button */
  #shootBtn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #ff2222 0%, #660000 100%);
    border: 3px solid #ffd700;
    border-radius: 50%;
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    letter-spacing: 1px;
    font-family: monospace;
    cursor: pointer;
  }
  #shootBtn:active {
    background: radial-gradient(circle, #ffd700 0%, #ff0000 100%);
    box-shadow: 0 0 40px #ffd700;
    transform: scale(0.92);
  }

  /* Cinematic Horror Overlay Sequences */
  #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(20,0,0,0.96) 0%, rgba(0,0,0,0.99) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; text-align: center; padding: 25px; }
  
  .title-glow { font-size: 44px; color: #ff1a1a; text-shadow: 0 0 30px #ff0000, 0 0 60px #800000; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
  .subtitle-card { background: rgba(255, 0, 0, 0.08); border: 1px solid rgba(255, 0, 0, 0.3); padding: 14px 24px; border-radius: 8px; margin: 12px 0; max-width: 90%; box-shadow: 0 0 25px rgba(255,0,0,0.12); }
  .text-main { font-size: 18px; color: #ffcccc; font-weight: bold; letter-spacing: 1px; }

  #fingerIcon { font-size: 90px; margin: 15px 0; text-shadow: 0 0 35px #ff0000; animation: pulse 1.1s infinite ease-in-out; display: none; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.22) rotate(-8deg); } 100% { transform: scale(1); } }

  .btn-container { display: flex; gap: 20px; margin-top: 20px; }
  .actionBtn { padding: 14px 38px; font-size: 20px; background: linear-gradient(135deg, #ff1a1a, #800000); color: #fff; border: 2px solid #ffd700; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 6px; box-shadow: 0 0 25px rgba(255,0,0,0.6); }
  .actionBtn:active { transform: scale(0.95); }
  .exitBtn { background: linear-gradient(135deg, #333, #111); border-color: #aaa; }
</style>
</head>
<body>

<!-- HUD Elements -->
<div id="levelHUD">LEVEL 1</div>
<div id="weaponHUD">WEAPON: <span id="weaponDisplay" style="color: #fff;">AK-47</span></div>
<div id="healthHUD">
  <div>SUCKS HP: <span id="playerHpDisplay" style="color: #00ffcc;">100</span> / 100</div>
  <div>ANACONDA HP: <span id="bossHpDisplay" style="color: #ff4444;">350</span></div>
</div>

<!-- Mobile Touch Fire Button -->
<div id="shootBtn">FIRE</div>

<div id="overlay">
  <div id="overlayContent">
    <h1 class="title-glow">ANACONDA AND SUCK</h1>
    <div class="subtitle-card">
      <p class="text-main">Tilt phone left/right to steer Suck.<br>Tap red FIRE button to shoot!</p>
    </div>
  </div>
  <div id="fingerIcon">🖕</div>
  <div class="btn-container" id="menuBtnContainer">
    <button class="actionBtn" onclick="enableGyroAndStart()">START GAME</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mobile Gyroscope Handling
let tiltX = 0;
function handleOrientation(event) {
  let gamma = event.gamma; 
  if (gamma !== null && gamma !== undefined) {
    if (Math.abs(gamma) > 2) {
      tiltX = (gamma / 20) * 12;
    } else {
      tiltX = 0;
    }
  }
}

function enableGyroAndStart() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
        startGame();
      })
      .catch(() => startGame());
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
    startGame();
  }
}

// Mobile Fire Button Handling
let isFiringTouch = false;
const shootBtn = document.getElementById('shootBtn');

shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isFiringTouch = true; }, { passive: false });
shootBtn.addEventListener('touchend', (e) => { e.preventDefault(); isFiringTouch = false; }, { passive: false });
shootBtn.addEventListener('mousedown', () => { isFiringTouch = true; });
shootBtn.addEventListener('mouseup', () => { isFiringTouch = false; });

// Audio Synth & Horror BGM System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let bgmInterval = null;

function startHorrorBGM() {
  if (bgmInterval) clearInterval(bgmInterval);
  if (audioCtx.state === 'suspended') audioCtx.resume();

  let beat = 0;
  bgmInterval = setInterval(() => {
    if (gameState !== 'PLAYING') return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const droneNotes = [45, 48.5, 42, 38];
    
    osc.frequency.setValueAtTime(droneNotes[beat % droneNotes.length], audioCtx.currentTime);
    osc.type = 'sawtooth';
    
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.3);
    beat++;
  }, 900);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  if (type === 'gun') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
  } else if (type === 'heavy') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  } else if (type === 'bazooka') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  } else if (type === 'fireball') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
  } else if (type === 'hit') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  } else if (type === 'scary_drone') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.8);
    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);
  }
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.8);
}

// Inputs
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Game State
let gameState = 'MENU';
let currentLevel = 1;
let player = { x: width / 2, y: height - 120, hp: 100, maxHp: 100, speed: 10, fireCooldown: 0 };
let bullets = [];
let enemyFireballs = [];
let particles = [];
let impactAnimations = [];

let anaconda = {
  x: width / 2, y: 60, hp: 350, maxHp: 350, speedY: 0.18, segments: [], length: 20,
  swirlAngle: 0, swirlRadius: 280, scaleSize: 22, spikes: 1, colorTheme: 'green',
  fireTimer: 0
};

function getWeaponDetails(lvl) {
  if (lvl === 1) return { name: 'AK-47', damage: 18, rate: 14, type: 'bullet', style: 'ak47', flameColor: '#ffcc00' };
  if (lvl === 2) return { name: 'Tactical Submachine Gun', damage: 28, rate: 11, type: 'bullet', style: 'smg', flameColor: '#00ffcc' };
  if (lvl === 3) return { name: 'Heavy Assault Rifle', damage: 45, rate: 9, type: 'bullet', style: 'assault', flameColor: '#ff5500' };
  if (lvl === 4) return { name: 'Quad-Barrel Gatling Gun', damage: 65, rate: 6, type: 'bullet', style: 'gatling', flameColor: '#00ffff' };
  if (lvl === 5) return { name: 'Standard Bazooka MK-I', damage: 120, rate: 22, type: 'missile', style: 'bazooka1', flameColor: '#ff2200' };
  if (lvl === 6) return { name: 'Advanced Plasma Launcher MK-II', damage: 180, rate: 20, type: 'missile', style: 'bazooka2', flameColor: '#bf00ff' };
  if (lvl === 7) return { name: 'Hyper-Velocity Rocket Cannon MK-III', damage: 260, rate: 18, type: 'missile', style: 'bazooka3', flameColor: '#ffff00' };
  if (lvl === 8) return { name: 'Quantum Destroyer Cannon MK-IV', damage: 370, rate: 16, type: 'missile', style: 'bazooka4', flameColor: '#00ff66' };
  if (lvl === 9) return { name: 'Apocalypse Titan Launcher MK-V', damage: 500, rate: 14, type: 'missile', style: 'bazooka5', flameColor: '#ff00aa' };
  
  let scaleFactor = lvl - 9;
  return { 
    name: `Infinite Doom Cannon MK-${9 + scaleFactor}`, 
    damage: 600 + scaleFactor * 150, 
    rate: Math.max(6, 13 - scaleFactor), 
    type: 'missile', 
    style: 'ultimate', 
    flameColor: `hsl(${ (lvl * 45) % 360 }, 100%, 60%)` 
  };
}

function initLevel(lvl) {
  currentLevel = lvl;
  player.x = width / 2;
  anaconda.x = width / 2;
  anaconda.y = 60;
  anaconda.swirlAngle = 0;
  
  let wpn = getWeaponDetails(lvl);
  anaconda.maxHp = 350 + (lvl - 1) * 260;
  anaconda.hp = anaconda.maxHp;
  anaconda.speedY = 0.2 + (lvl * 0.04); 
  
  anaconda.length = Math.min(30, 18 + Math.floor(lvl * 1.3));
  anaconda.scaleSize = Math.min(28, 18 + Math.floor(lvl * 0.7));
  
  let linearityFactor = Math.max(0.05, 1 - ((lvl - 1) * 0.1));
  anaconda.swirlRadius = Math.max(20, (width * 0.35 - (lvl * 15)) * linearityFactor);
  anaconda.spikes = Math.min(6, 1 + Math.floor(lvl * 0.6));
  
  if (lvl <= 2) anaconda.colorTheme = 'green';
  else if (lvl <= 4) anaconda.colorTheme = 'crimson';
  else if (lvl <= 7) anaconda.colorTheme = 'dragon_gold';
  else anaconda.colorTheme = 'nether_titan';

  anaconda.segments = [];
  for (let i = 0; i < anaconda.length; i++) {
    anaconda.segments.push({ x: anaconda.x, y: anaconda.y - i * 14 });
  }

  document.getElementById('levelHUD').innerText = `LEVEL ${currentLevel}`;
  document.getElementById('weaponDisplay').innerText = wpn.name;
  document.getElementById('bossHpDisplay').innerText = anaconda.hp;
  document.getElementById('playerHpDisplay').innerText = player.hp;
}

function startGame() {
  gameState = 'PLAYING';
  player.hp = player.maxHp;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('fingerIcon').style.display = 'none';
  document.getElementById('shootBtn').style.display = 'flex';
  startHorrorBGM();
  initLevel(1);
}

function restartGame() {
  startGame();
}

function exitGame() {
  window.location.reload();
}

function gameOver() {
  gameState = 'GAMEOVER';
  stopBGM();
  playSound('scary_drone');
  document.getElementById('shootBtn').style.display = 'none';

  const overlay = document.getElementById('overlay');
  const content = document.getElementById('overlayContent');
  const finger = document.getElementById('fingerIcon');
  const btnContainer = document.getElementById('menuBtnContainer');

  overlay.style.display = 'flex';
  finger.style.display = 'none';
  btnContainer.innerHTML = '';

  content.innerHTML = `<h1 class="title-glow" style="font-size: 54px; letter-spacing: 4px;">YOU LOST</h1>`;

  setTimeout(() => {
    if (gameState !== 'GAMEOVER') return;
    finger.style.display = 'block';
    content.innerHTML = `
      <div class="subtitle-card" style="border-color: #ff3333; margin-top: 10px;">
        <p class="text-main" style="font-size: 20px;">Anaconda is the eternal villain of Sucks' life</p>
      </div>
    `;

    setTimeout(() => {
      if (gameState !== 'GAMEOVER') return;
      finger.style.display = 'none';
      content.innerHTML = '';
      overlay.style.background = '#000';

      setTimeout(() => {
        if (gameState !== 'GAMEOVER') return;
        overlay.style.background = 'radial-gradient(circle, rgba(20,0,0,0.96) 0%, rgba(0,0,0,0.99) 100%)';
        content.innerHTML = `
          <div style="font-size: 34px; color: #fff; text-shadow: 0 0 20px #ff0000; font-weight: bold; margin-bottom: 20px; letter-spacing: 4px; border-bottom: 2px solid #ff0000; padding-bottom: 8px;">GAME OVER</div>
        `;
        btnContainer.innerHTML = `
          <button class="actionBtn" onclick="restartGame()">REPLAY</button>
          <button class="actionBtn exitBtn" onclick="exitGame()">EXIT</button>
        `;
      }, 1000);

    }, 3000);

  }, 2500);
}

function update() {
  if (gameState !== 'PLAYING') return;
  player.y = height - 120;

  // Steering: Combine Gyroscope + Keyboard Controls
  player.x += tiltX;
  if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
  if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;
  
  if (player.x < 40) player.x = 40;
  if (player.x > width - 40) player.x = width - 40;

  let wpn = getWeaponDetails(currentLevel);

  if (player.fireCooldown > 0) player.fireCooldown--;
  if ((keys['Space'] || isFiringTouch) && player.fireCooldown <= 0) {
    if (wpn.type === 'missile') {
      playSound('bazooka');
      bullets.push({ x: player.x, y: player.y - 50, vx: 0, vy: -18, type: 'missile', damage: wpn.damage, flameColor: wpn.flameColor });
    } else {
      playSound(currentLevel >= 3 ? 'heavy' : 'gun');
      let spread = (Math.random() - 0.5) * 4;
      bullets.push({ x: player.x + spread, y: player.y - 50, vx: spread * 0.2, vy: -28, type: 'bullet', damage: wpn.damage, flameColor: wpn.flameColor });
    }

    for (let f = 0; f < 4; f++) {
      particles.push({
        x: player.x + (Math.random() - 0.5) * 18, y: player.y - 55,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7 - 2,
        life: 8, color: wpn.flameColor, radius: Math.random() * 4 + 2
      });
    }
    player.fireCooldown = wpn.rate;
  }

  let linearityFactor = Math.max(0.05, 1 - ((currentLevel - 1) * 0.1));
  anaconda.swirlAngle += (0.015 + (currentLevel * 0.002)) * linearityFactor; 
  let targetX = (width / 2) + Math.sin(anaconda.swirlAngle) * anaconda.swirlRadius;
  
  if (currentLevel >= 5) {
    targetX += (player.x - targetX) * Math.min(0.85, 0.2 + (currentLevel * 0.06));
  }

  anaconda.y += anaconda.speedY; 
  anaconda.x += (targetX - anaconda.x) * 0.08;

  if (currentLevel >= 5) {
    anaconda.fireTimer++;
    let fireInterval = Math.max(35, 100 - (currentLevel * 6));
    if (anaconda.fireTimer >= fireInterval) {
      anaconda.fireTimer = 0;
      playSound('fireball');
      let angle = Math.atan2((player.y - 40) - anaconda.y, player.x - anaconda.x);
      let fbSpeed = 6 + (currentLevel * 0.45);
      enemyFireballs.push({
        x: anaconda.x, y: anaconda.y,
        vx: Math.cos(angle) * fbSpeed, vy: Math.sin(angle) * fbSpeed,
        radius: 16, damage: 10 + Math.min(10, Math.floor(currentLevel * 1.5))
      });
    }
  }

  anaconda.segments[0] = { x: anaconda.x, y: anaconda.y };
  for (let i = 1; i < anaconda.length; i++) {
    let segPrev = anaconda.segments[i - 1];
    let segCurr = anaconda.segments[i];
    let sdx = segPrev.x - segCurr.x;
    let sdy = segPrev.y - segCurr.y;
    let sdist = Math.hypot(sdx, sdy);
    let spacing = anaconda.scaleSize * 0.65;
    if (sdist > spacing) {
      segCurr.x = segPrev.x - (sdx / sdist) * spacing;
      segCurr.y = segPrev.y - (sdy / sdist) * spacing;
    }
  }

  if (anaconda.y >= height - 130 || Math.hypot(anaconda.x - player.x, anaconda.y - player.y) < (anaconda.scaleSize + 25)) {
    gameOver();
    return;
  }

  for (let i = enemyFireballs.length - 1; i >= 0; i--) {
    let fb = enemyFireballs[i];
    fb.x += fb.vx;
    fb.y += fb.vy;

    if (Math.hypot(fb.x - player.x, fb.y - (player.y - 30)) < 38) {
      player.hp -= fb.damage;
      playSound('hit');
      document.getElementById('playerHpDisplay').innerText = Math.max(0, player.hp);
      
      for (let p = 0; p < 10; p++) {
        particles.push({
          x: fb.x, y: fb.y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9,
          life: 12, color: '#ff2200', radius: Math.random() * 4 + 2
        });
      }

      enemyFireballs.splice(i, 1);
      if (player.hp <= 0) {
        gameOver();
        return;
      }
      continue;
    }

    if (fb.y > height || fb.x < 0 || fb.x > width) enemyFireballs.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;

    let hit = false;
    for (let j = 0; j < anaconda.segments.length; j++) {
      let seg = anaconda.segments[j];
      if (Math.hypot(b.x - seg.x, b.y - seg.y) < (anaconda.scaleSize + (b.type === 'missile' ? 18 : 0))) {
        anaconda.hp -= b.damage;
        document.getElementById('bossHpDisplay').innerText = Math.max(0, anaconda.hp);
        
        impactAnimations.push({
          x: b.x, y: b.y, radius: 4, maxRadius: b.type === 'missile' ? 55 : 28, alpha: 1.0, color: b.flameColor
        });
        
        for (let p = 0; p < (b.type === 'missile' ? 14 : 5); p++) {
          particles.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
            life: 15, color: b.flameColor,
            radius: Math.random()
